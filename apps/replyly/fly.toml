# Fly.io config. Create the app and volume once, then deploy:
#   fly launch --no-deploy --copy-config
#   fly volumes create replyly_data --size 1 --region lhr
#   fly secrets set ANTHROPIC_API_KEY=... PAYSTACK_SECRET_KEY=...
#   fly deploy
app = "replyly"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"

[mounts]
  source = "replyly_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/status"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
